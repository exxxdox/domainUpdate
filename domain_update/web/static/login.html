<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · IPv6 域名控制台</title>
    <!-- 与首页同一套 CSP：只加载同源资源，图标内联成 data: URI。 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2308131f'/%3E%3Cpath d='M16 6v20M11 11l5-5 5 5M12 21l4 5 4-5' stroke='%2338c8e8' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <!-- 表单不写 action/method：CSP 的 form-action 'none' 会拦掉原生提交，
           提交一律由 login.js 走 fetch 完成。写了 action 反而会掩盖「脚本没加载」
           这类问题——那种情况下页面什么都不做，看不出原因。 -->
      <form class="card login-card" id="login-form" novalidate>
        <h1 class="login-title">IPv6 域名控制台</h1>
        <p class="login-hint">请输入部署时在环境变量里配置的账号与密码。</p>

        <div class="field">
          <label for="username">用户名</label>
          <input type="text" id="username" autocomplete="username" autofocus />
        </div>

        <div class="field">
          <label for="password">密码</label>
          <input type="password" id="password" autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="login-button">
          登录
        </button>

        <p class="notice" id="login-notice" hidden></p>
      </form>
    </main>

    <!-- 不加载 app.js：那个脚本按首页的元素 id 初始化，取不到就会抛错。 -->
    <script src="/login.js" defer></script>
  </body>
</html>
