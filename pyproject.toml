[project]
name = "domain-update"
version = "0.1.0"
description = "Update DNS records with the current public IPv6 address"
readme = "README.md"
requires-python = ">=3.10"
# 依赖只保留运行必需项：界面改为标准库 http.server，Cloudflare 改为直调 REST，
# 去掉 streamlit 与 cloudflare 两个大包后镜像体积下降约 470MB。
dependencies = [
    "apscheduler>=3.11,<4",
    "alibabacloud-alidns20150109==3.7.0",
    "alibabacloud-tea-openapi==0.4.2",
    "alibabacloud-tea-util==0.3.14",
    "requests==2.32.5",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
]

[tool.pytest.ini_options]
# 项目采用脚本式目录结构，显式加入仓库根目录以保持测试导入路径与实际运行一致。
pythonpath = ["."]
testpaths = ["tests"]
